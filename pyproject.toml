[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "mlflow>=2.14",
    "scikit-learn",
    "xgboost",
    "evidently",
    "prometheus-client",
    "pandas",
    "numpy",
    "httpx",
    "openai",
    "locust",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "matplotlib",
    "pyyaml",
    "mypy>=1.11",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Pragmatic first-pass typing over the app package. 3.12 is the PARSE target only
# (so numpy's PEP-695 `type` stubs parse); runtime stays 3.11-compatible. Not
# --strict yet — a ratchet to tighten over time.
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Gate below the current 96% so churn doesn't fail CI while a real regression does.
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
